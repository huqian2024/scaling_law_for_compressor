parameter_formula_map:
  Xthick: thickness polynomial break point (xc <= Xthick); St1/St2 denominators; b1..b3,
    b6, b7; LE/TE circle St1/St2 (Tmax/2 - T1/2)/Xthick and (Tmax/2 - T2/2)/(1-Xthick);
    hence LE/TE arc centres and radii.
  Tmax: thickness amplitudes Tmax/2 in St1, St2, b1..b3, b6, b7 and in the LE/TE circle
    St1/St2; changes thickness distribution and both edge radii.
  Metal2: exit metal angle -> Sm2 = tan(Metal2); enters Sm0, SSm1 = Ks1*(Sm2-Sm1),
    SSm2 = Ks2*(Sm2-Sm1) and meanline coefficients a1..a8 (camber/turning).
  Solidity: does NOT enter the blade coordinates. Only .geomTurbo periodicity = CHORD_TARGET
    / Solidity (cascade pitch). Single-blade metrics must be identical for a fixed
    (Xthick,Tmax,Metal2,Metal1,T1,T2,Xmean,K_m,Ks1,Ks2,SS1,SS2).
  Metal1: inlet METAL angle -> Sm1 = tan(Metal1); enters Sm0, SSm1, SSm2 and a1..a8.
    Not an incidence and not converted to a flow angle.
  T1: b5 = T1/2 (LE half-thickness of the thickness polynomial), St1 amplitude, and
    LE circle rr1/r1 through the surface endpoints.
  T2: b10 = T2/2 (TE half-thickness), St2 amplitude, and TE circle rr2/r2 through
    the surface endpoints.
  Xmean: meanline piecewise break point (xc <= Xmean) and denominator of a1, a2, a5,
    a6; changes camber distribution and the C1 splice location.
  K_m: fraction of turning at Xmean -> Sm0 = tan(Metal1 + (Metal2-Metal1)*K_m); enters
    a1, a2, a5, a6.
  Ks1: front meanline slope multiplier -> SSm1 = Ks1*(Sm2-Sm1); affects a1, a2, a3
    (=SSm1) and the front camber slope/curvature.
  Ks2: rear meanline slope multiplier -> SSm2 = Ks2*(Sm2-Sm1); affects a1, a2, a5,
    a6, a7 (=-SSm2) and the rear camber slope/curvature.
  SS1: front thickness-change coefficient -> St1 = SS1*(Tmax/2-T1/2)/Xthick; affects
    thickness coefficients b1..b4. NOTE legacy recomputes the LE circle St1 WITHOUT
    SS1, so SS1 changes the surface slope but not the LE arc radius.
  SS2: rear thickness-change coefficient -> St2 = SS2*(Tmax/2-T2/2)/(1-Xthick); affects
    thickness coefficients b6, b7, b9. NOTE legacy recomputes the TE circle St2 WITHOUT
    SS2, so SS2 changes the surface slope but not the TE arc radius.
